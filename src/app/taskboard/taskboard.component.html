<ul class="main_container w-full list-list flex flex-row gap-2 p-3 overflow-x-scroll select-none">
  <li
    *ngFor="let taskList of selectedBoard.taskLists"
    (click)="onListClick(taskList, $event)"
    class="w-72 h-fit min-w-72 px-2 py-2 rounded-xl bg-[#101204]"
  >
    <span class="flex mx-4 mb-3">{{ taskList.name }}</span>

    <ul class="task-list flex flex-col gap-2 mt-2 text-neutral-400">
      <li
        *ngFor="let task of taskList.tasks"
        [ngClass]="{'bg-[#343538]': task.editing, 'bg-[#242528]': !task.editing}"
        class="py-2 px-4 rounded-lg group relative"
      >
        <!-- Display mode -->
        <div *ngIf="!task.editing" class="flex flex-row gap-2 cursor-pointer" (dblclick)="editTask(task)">
          <div class="shrink-0 flex flex-row items-center" (click)="$event.stopPropagation()">
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                [checked]="task.done"
                (change)="toggleTaskDone(task, taskList.id)"
                class="hidden"
              />
              <div 
                class="h-4 w-4 rounded-full border-2 items-center justify-center transition-all duration-200 opacity-0 group-hover:opacity-100 group-hover:flex"
                [ngClass]="{'flex opacity-100 bg-blue-500 border-blue-500': task.done, 'hidden bg-transparent border-gray-500 hover:border-blue-400': !task.done}"
              >
                <svg *ngIf="task.done" class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
            </label>
          </div>
          <span 
            class="flex-1 flex flex-row pb-0.5"
            (click)="onTaskClick(task, $event)"
            (dblclick)="editTask(task)"
            [class.line-through]="task.done"
            [class.text-gray-500]="task.done"
          >
            {{ task.title }}
          </span>

          <button
            (click)="deleteTask(task, taskList.id); $event.stopPropagation()"
            class="text-gray-400 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded hover:bg-red-900/20 cursor-pointer"
            title="Delete task"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
        
        <!-- Edit mode -->
        <div *ngIf="task.editing" class="edit-mode">
          <input 
            #editInput
            [attr.data-task-id]="task.id"
            [(ngModel)]="task.title" 
            (keyup.enter)="saveTask(task, taskList.id)"
            (blur)="saveTask(task, taskList.id)"
            (keyup.escape)="cancelEdit(task)"
            class="w-full text-white focus:outline-none "
            autofocus
          />
        </div>
      </li>
      
      <!-- Add task button (keep as is) -->
      <li 
        class="py-0 px-4 rounded-lg hover:bg-[#343538] flex justify-items-start items-center gap-2 cursor-pointer"
        (click)="addTask('New task', taskList.id)"
      >
        <span class="font-thin text-2xl pb-1.5">+</span> 
        Add a new task
      </li>
    </ul>
  </li>
  
  <button
    class="w-72 min-w-72 px-4 py-2 h-12 bg-[#2281a7ce] hover:bg-[#2281a7] text-white rounded-xl flex justify-items-start items-center gap-2 cursor-pointer"
    (click)="onAddListClick()"
  >
  <span class="font-thin text-2xl pb-1.5">+</span> Add a new list
  </button>
</ul>
